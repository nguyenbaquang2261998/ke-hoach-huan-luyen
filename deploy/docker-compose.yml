name: tapluyen

services:
  app:
    image: ${APP_IMAGE}
    container_name: tapluyen-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    ports:
      - "127.0.0.1:3016:3001"

volumes:
  app_data:
