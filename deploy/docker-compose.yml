name: tapluyen

services:
  app:
    image: ${APP_IMAGE}
    container_name: tapluyen-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    container_name: tapluyen-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/tapluyen.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  app_data:
