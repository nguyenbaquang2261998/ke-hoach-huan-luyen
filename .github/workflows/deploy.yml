name: Deploy Tapluyen

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: tapluyen
  DEPLOY_DIR: tapluyen
  REMOTE_TMP_DIR: /tmp/tapluyen-deploy
  DOMAIN_NAME: khhl.vmeta.vn
  NGINX_CONF_NAME: khhl.vmeta.vn.conf

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    concurrency:
      group: tapluyen-production
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./army-tech
          file: ./army-tech/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tapluyen:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tapluyen:${{ github.sha }}

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Copy deploy files to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          : "${SSHPASS:?Missing VPS_PASSWORD}"
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}"

          REMOTE="${VPS_USER}@${VPS_HOST}"
          SSH_BASE=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

          sshpass -e ssh "${SSH_BASE[@]}" -p "${VPS_PORT}" "${REMOTE}" "rm -rf '${REMOTE_TMP_DIR}' && mkdir -p '${REMOTE_TMP_DIR}/nginx'"
          sshpass -e scp "${SSH_BASE[@]}" -P "${VPS_PORT}" deploy/docker-compose.yml "${REMOTE}:${REMOTE_TMP_DIR}/docker-compose.yml"
          sshpass -e scp "${SSH_BASE[@]}" -P "${VPS_PORT}" deploy/nginx/tapluyen.conf "${REMOTE}:${REMOTE_TMP_DIR}/nginx/tapluyen.conf"

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          : "${SSHPASS:?Missing VPS_PASSWORD}"
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_PORT:?Missing VPS_PORT}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN}"

          APP_IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${GIT_SHA}"
          REMOTE="${VPS_USER}@${VPS_HOST}"
          SSH_BASE=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          REMOTE_ENV=$(printf 'APP_IMAGE=%q DOCKERHUB_USERNAME=%q DOCKERHUB_TOKEN=%q DEPLOY_DIR=%q REMOTE_TMP_DIR=%q DOMAIN_NAME=%q NGINX_CONF_NAME=%q' \
            "${APP_IMAGE}" "${DOCKERHUB_USERNAME}" "${DOCKERHUB_TOKEN}" "${DEPLOY_DIR}" "${REMOTE_TMP_DIR}" "${DOMAIN_NAME}" "${NGINX_CONF_NAME}")

          sshpass -e ssh "${SSH_BASE[@]}" -p "${VPS_PORT}" "${REMOTE}" "${REMOTE_ENV} bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker is not installed on the VPS."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose plugin is not available on the VPS."
            exit 1
          fi

          DEPLOY_PATH="${HOME}/${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_PATH}/nginx"
          cp -R "${REMOTE_TMP_DIR}/." "${DEPLOY_PATH}/"
          cd "${DEPLOY_PATH}"

          if [ ! -f .env ]; then
            AUTH_TOKEN_SECRET="$(openssl rand -hex 32 2>/dev/null || date +%s | sha256sum | awk '{print $1}')"
            DEFAULT_ADMIN_PASSWORD="$(openssl rand -base64 32 2>/dev/null | tr -dc 'A-Za-z0-9' | head -c 20)"
            if [ -z "${DEFAULT_ADMIN_PASSWORD}" ]; then
              DEFAULT_ADMIN_PASSWORD="$(date +%s | sha256sum | head -c 20)"
            fi

            cat > .env <<EOF
          APP_IMAGE=${APP_IMAGE}
          PORT=3001
          NODE_ENV=production
          DATA_DIR=/app/data
          AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
          AUTH_TOKEN_TTL_SECONDS=86400
          DEFAULT_ADMIN_USERNAME=admin
          DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
          OPENAI_MODEL=gpt-4o-mini
          AI_DOC_CONTEXT_MAX_CHARS=18000
          AI_DOC_CHUNK_MAX_CHARS=2200
          AI_RESPONSE_MAX_TOKENS=700
          EOF
            chmod 600 .env
          else
            TMP_ENV="$(mktemp)"
            awk -v image="${APP_IMAGE}" '
              BEGIN { updated = 0 }
              /^APP_IMAGE=/ { print "APP_IMAGE=" image; updated = 1; next }
              { print }
              END { if (!updated) print "APP_IMAGE=" image }
            ' .env > "${TMP_ENV}"
            mv "${TMP_ENV}" .env
            chmod 600 .env
          fi

          printf '%s' "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          install -m 0644 "${REMOTE_TMP_DIR}/nginx/tapluyen.conf" "/etc/nginx/sites-available/${NGINX_CONF_NAME}"
          ln -sfn "/etc/nginx/sites-available/${NGINX_CONF_NAME}" "/etc/nginx/sites-enabled/${NGINX_CONF_NAME}"
          rm -f /etc/nginx/sites-enabled/tapluyen.vmeta.vn.conf /etc/nginx/sites-available/tapluyen.vmeta.vn.conf
          nginx -t
          systemctl reload nginx

          docker compose ps
          REMOTE_SCRIPT
