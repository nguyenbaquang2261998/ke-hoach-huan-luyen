<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>In Phiếu Tiếp Nhận - Học viện Chính trị</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Times+New+Roman&display=swap');
    
    body {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 0;
      background: #f0f2f5;
    }
    
    .print-container {
      max-width: 210mm; /* A4 width */
      margin: 0 auto;
      background: white;
    }

    .receipt-page {
      padding: 20mm;
      box-sizing: border-box;
      min-height: 297mm; /* A4 height */
      page-break-after: always;
      position: relative;
    }
    
    .receipt-page:last-child {
      page-break-after: auto;
    }

    .header-center {
      text-align: center;
      margin-bottom: 20px;
    }

    .header-title-1 {
      font-size: 16px;
      font-weight: bold;
      margin: 0;
      text-transform: uppercase;
    }

    .header-title-2 {
      font-size: 16px;
      font-weight: bold;
      margin: 5px 0 0 0;
    }

    .header-line {
      display: inline-block;
      width: 150px;
      border-bottom: 1px solid black;
      margin: 2px 0 15px 0;
    }

    .receipt-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      margin-top: 30px;
      margin-bottom: 5px;
    }
    
    .receipt-subtitle {
      text-align: center;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .info-row {
      display: flex;
      font-size: 15px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .info-label {
      width: 220px;
      flex-shrink: 0;
    }
    
    .info-value {
      flex-grow: 1;
    }
    
    .info-bullet {
      margin-left: 15px;
    }
    
    .note {
      font-size: 15px;
      font-style: italic;
      font-weight: bold;
      margin-top: 30px;
      line-height: 1.5;
    }

    .commitment {
      font-size: 15px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .signature-section {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
    }

    .signature-box {
      text-align: center;
      width: 250px;
    }

    .signature-date {
      font-size: 15px;
      margin-bottom: 5px;
      font-style: italic;
    }
    
    .signature-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 80px;
    }

    .no-data {
      padding: 50px;
      text-align: center;
      font-family: sans-serif;
    }

    /* Print specific styles */
    @media print {
      body {
        background: white;
      }
      .print-container {
        max-width: 100%;
        margin: 0;
      }
      .receipt-page {
        padding: 0;
        margin: 0;
        min-height: auto;
      }
    }
    
    .progress-container {
      max-width: 500px;
      margin: 100px auto;
      text-align: center;
      font-family: sans-serif;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #ccc;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
      display: none;
    }
    .progress-fill {
      height: 100%;
      background: #15803d;
      width: 0%;
      transition: width 0.2s;
    }
    #render-container {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="progress-container" id="status-container">
    <h3 id="status-text">Đang tải dữ liệu...</h3>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
  <div id="render-container"></div>

  <script>
    // Format date string to dDay, dMonth, dYear
    function parseDate(dateStr) {
      if (!dateStr) return { day: '...', month: '...', year: '...' };
      try {
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) {
            const parts = dateStr.split('-');
            if(parts.length === 3) return { day: parseInt(parts[2]), month: parseInt(parts[1]), year: parts[0] };
            return { day: '...', month: '...', year: '...' };
        }
        return { day: d.getDate(), month: d.getMonth() + 1, year: d.getFullYear() };
      } catch (e) {
        return { day: '...', month: '...', year: '...' };
      }
    }

    async function loadDataAndPrint() {
      try {
        // Lấy token để gọi API (cùng cơ chế với app.js)
        const authDataStr = localStorage.getItem('armyTechAuth');
        const headers = {};
        if (authDataStr) {
          try {
            const authData = JSON.parse(authDataStr);
            if (authData && authData.accessToken) {
              headers['Authorization'] = `Bearer ${authData.accessToken}`;
            }
          } catch (e) {
            console.error('Failed to parse auth token', e);
          }
        }

        // Lấy điều kiện lọc từ URL
        const query = window.location.search;
        
        const response = await fetch(`/api/students${query}`, { headers });
        if (!response.ok) throw new Error('Không thể tải dữ liệu học viên');
        
        let students = await response.json();
        
        // Nếu API trả về { data: [] } thay vì mảng trực tiếp (phòng ngừa)
        if (students.data && Array.isArray(students.data)) {
           students = students.data;
        }

        const statusContainer = document.getElementById('status-container');
        const statusText = document.getElementById('status-text');
        
        if (!students || students.length === 0) {
          statusContainer.innerHTML = '<div class="no-data">Không có học viên nào phù hợp với điều kiện lọc.</div>';
          return;
        }

        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const renderContainer = document.getElementById('render-container');
        
        statusText.innerText = 'Đang chuẩn bị xuất PDF...';
        progressBar.style.display = 'block';

        const zip = new JSZip();

        for (let i = 0; i < students.length; i++) {
          const student = students[i];
          const targetTitle = (student.target_name || 'ĐÀO TẠO').toUpperCase();
          const pDate = parseDate(student.declaration_date || student.admission_date || new Date().toISOString().slice(0, 10));
          
          const htmlContent = `
            <div class="receipt-page" style="width: 210mm; padding: 20mm; background: white; font-family: 'Times New Roman', Times, serif; color: black; box-sizing: border-box;">
              <div class="header-center" style="text-align: center; margin-bottom: 20px;">
                <p class="header-title-1" style="font-weight: bold; font-size: 16px; margin:0;">CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</p>
                <p class="header-title-2" style="font-weight: bold; font-size: 16px; margin:0; text-decoration: underline;">Độc lập – Tự do – Hạnh phúc</p>
              </div>

              <div class="receipt-title" style="text-align: center; font-weight: bold; font-size: 18px; margin-top: 40px; margin-bottom: 5px;">PHIẾU ĐĂNG KÝ NHẬP HỌC ${targetTitle}</div>
              <div class="receipt-subtitle" style="text-align: center; font-size: 16px; margin-bottom: 30px;">Kính gửi: Phòng Đào tạo/Học viện Chính trị</div>

              <div class="section-title" style="font-weight: bold; font-size: 16px; margin-top: 15px; margin-bottom: 10px;">I. THÔNG TIN HỌC VIÊN</div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 180px;">1. Họ và tên:</div>
                <div class="info-value" style="flex: 1; font-weight: bold;">${student.full_name || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 180px;">2. Ngày sinh:</div>
                <div class="info-value" style="flex: 1;">${student.birthday || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 180px;">3. Nơi sinh:</div>
                <div class="info-value" style="flex: 1;">${student.birthplace || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 180px;">4. Quê quán:</div>
                <div class="info-value" style="flex: 1;">${student.hometown || ''}</div>
              </div>

              <div class="section-title" style="font-weight: bold; font-size: 16px; margin-top: 15px; margin-bottom: 10px;">II. THÔNG TIN CÔNG TÁC</div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 250px;">1. Cấp bậc:</div>
                <div class="info-value" style="flex: 1;">${student.rank || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 250px;">2. Chức vụ:</div>
                <div class="info-value" style="flex: 1;">${student.position || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 250px;">3. Đơn vị (Trực thuộc Bộ):</div>
                <div class="info-value" style="flex: 1;">${student.unit || ''}</div>
              </div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label" style="width: 250px;">4. Trình độ học vấn:</div>
                <div class="info-value" style="flex: 1;">${student.education_level || ''}</div>
              </div>

              <div class="section-title" style="font-weight: bold; font-size: 16px; margin-top: 15px; margin-bottom: 10px;">III. THÔNG TIN LIÊN HỆ</div>
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label info-bullet" style="width: 180px;">• Số điện thoại:</div>
                <div class="info-value" style="flex: 1;">${student.phone || ''}</div>
              </div>
              ${student.id_card ? `
              <div class="info-row" style="display: flex; margin-bottom: 8px; font-size: 16px;">
                <div class="info-label info-bullet" style="width: 180px;">• Số CCCD/CMND:</div>
                <div class="info-value" style="flex: 1;">${student.id_card}</div>
              </div>
              ` : ''}

              <div class="note" style="font-size: 16px; font-style: italic; font-weight: bold; margin-top: 30px; line-height: 1.5;">Ghi chú: Chuẩn bị bản photocopy văn bằng (đã kê khai) kèm bản gốc để đối chiếu tại bàn tiếp nhận học viên.</div>
              
              <div class="commitment" style="font-size: 16px; margin-top: 15px; line-height: 1.5;">Tôi xin cam đoan các thông tin kê khai trên là hoàn toàn chính xác và chấp hành nghiêm chỉnh mọi quy chế, quy định của Học viện.</div>

              <div class="signature-section" style="margin-top: 20px; display: flex; justify-content: flex-end;">
                <div class="signature-box" style="text-align: center; width: 250px;">
                  <div class="signature-date" style="font-size: 16px; margin-bottom: 5px; font-style: italic;">Hà Nội, ngày ${pDate.day} tháng ${pDate.month} năm ${pDate.year}</div>
                  <div class="signature-title" style="font-size: 16px; font-weight: bold; margin-bottom: 80px;">NGƯỜI KÊ KHAI<br><span style="font-weight:normal; font-style:italic;">(Ký, ghi rõ họ tên)</span></div>
                </div>
              </div>
            </div>
          `;
          
          renderContainer.innerHTML = htmlContent;
          
          statusText.innerText = `Đang tạo PDF (${i + 1}/${students.length})...`;
          progressFill.style.width = `${((i + 1) / students.length) * 100}%`;

          const opt = {
            margin:       0,
            filename:     `Phieu_Tiep_Nhan_${student.student_code || student.id}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          if (students.length === 1) {
            await html2pdf().set(opt).from(renderContainer.firstElementChild).save();
            statusText.innerText = 'Hoàn tất xuất PDF!';
            return;
          } else {
            const pdfBlob = await html2pdf().set(opt).from(renderContainer.firstElementChild).output('blob');
            const safeName = student.full_name ? student.full_name.replace(/\s+/g, '_') : 'KhongTen';
            const fileName = `Phieu_${student.student_code || student.id}_${safeName}.pdf`;
            zip.file(fileName, pdfBlob);
          }
        }
        
        if (students.length > 1) {
          statusText.innerText = 'Đang nén các file PDF thành file ZIP...';
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(zipBlob);
          a.download = `Danh_Sach_Phieu_Tiep_Nhan.zip`;
          a.click();
          
          statusText.innerText = 'Hoàn tất tải xuống file ZIP chứa các PDF!';
        }

      } catch (err) {
        console.error(err);
        const statusContainer = document.getElementById('status-container') || document.body;
        statusContainer.innerHTML = `<div class="no-data" style="color:red">Lỗi tải dữ liệu: ${err.message}</div>`;
      }
    }

    // Run when page loads
    window.addEventListener('DOMContentLoaded', loadDataAndPrint);
  </script>
</body>
</html>
